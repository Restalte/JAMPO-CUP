<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd900"><title>TEAM | JAMPO CUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#ffd900;--ink:#171717;--muted:#777;--line:#dedede}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans JP",sans-serif;line-height:1.7}.top{height:76px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1240px)/2))}.brand{display:flex;align-items:center;gap:11px;font-weight:900;text-decoration:none;color:inherit}.bee{width:43px;height:43px;display:grid;place-items:center;background:var(--yellow);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font-size:25px}.brand-title{font-family:"Noto Serif JP",serif;font-size:24px;line-height:1}.brand-sub{display:block;font-size:9px;letter-spacing:.24em;margin-top:5px}.back{color:inherit;text-decoration:none;font-size:12px;font-weight:700;border-bottom:2px solid var(--yellow);padding:5px 0}.main{width:min(900px,calc(100% - 40px));margin:0 auto;padding:62px 0 100px;text-align:center}.kicker{font-size:10px;letter-spacing:.28em;color:#777;font-weight:900}.title{font-family:"Noto Serif JP",serif;font-size:clamp(28px,4vw,42px);margin:8px 0 30px}.emblem{width:min(220px,55vw);height:min(220px,55vw);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;overflow:hidden}.emblem img{display:block;width:100%;height:100%;object-fit:contain}.emblem-fallback{font-family:"Noto Serif JP",serif;font-size:clamp(70px,14vw,120px);font-weight:900}.coming{font-size:clamp(27px,4vw,36px);font-weight:900;letter-spacing:.09em;margin:25px 0 4px}.note{font-size:12px;color:#777;margin:0}.rule{border:0;border-top:1px solid var(--line);margin:42px 0 22px}.team-section{margin:42px 0;text-align:left}.section-title{font-size:23px;font-weight:900;border-bottom:2px solid var(--ink);padding-bottom:10px;margin:0 0 18px}.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.roster-card{display:grid;grid-template-columns:1fr 1fr;min-width:0;aspect-ratio:1.65/1;border:1px solid #dedede;border-top:3px solid var(--yellow);overflow:hidden;color:inherit;text-decoration:none;background:#fff}.roster-photo{min-width:0;min-height:0;overflow:hidden;clip-path:inset(0);display:flex;align-items:flex-end;justify-content:center;background:#fff}.roster-photo img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.roster-name{display:flex;align-items:center;padding:12px;font-size:clamp(13px,1.3vw,18px);font-weight:900;overflow-wrap:anywhere}.team-intro{white-space:pre-wrap;line-height:2;background:#fff;padding:22px;border-top:1px solid #dedede;min-height:60px}.hidden{display:none!important}@media(max-width:760px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.roster-card{aspect-ratio:1.25/1}.roster-name{padding:9px;font-size:14px}}@media(max-width:420px){.roster{grid-template-columns:1fr}.roster-card{aspect-ratio:1.8/1}}.footer{font-size:10px;color:#888;text-align:center;padding:20px;border-top:1px solid #eee}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="cloud-sync.js"></script>
</head>
<body><header class="top"><a class="brand" href="index.html"><span class="bee">蜂</span><span><span class="brand-title">雀蜂杯</span><span class="brand-sub">JAMPO CUP</span></span></a><a class="back" href="index.html#teams">参加チーム一覧へ ←</a></header>
<main class="main"><div class="kicker">JAMPO CUP / TEAM PROFILE</div><div id="team-content"><h1 class="title" id="team-name">チームページ</h1><div class="emblem" id="team-emblem"></div><div class="team-section"><h2 class="section-title">選手</h2><div id="team-roster" class="roster"></div></div><div class="team-section"><h2 class="section-title">チーム紹介</h2><div id="team-intro" class="team-intro"></div></div></div><div id="unpublished"><div class="coming">COMING SOON</div><p class="note">ドラフト会議終了後順次更新</p><hr class="rule"><p class="note">このチームページはまだ公開されていません。</p></div></main><footer class="footer">© 2026 JAMPO CUP. All rights reserved.</footer>
<script>
const KEY='jakuhouCupDataV8';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const requested=new URLSearchParams(location.search).get('team')||'';let data={teams:[],teamMeta:{},players:[]};try{data={...data,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const team=(data.teams||[]).includes(requested)?requested:'';const meta=team?(data.teamMeta?.[team]||{}):{};const content=document.getElementById('team-content'),unpublished=document.getElementById('unpublished');if(!team||!meta.published){content.classList.add('hidden');unpublished.classList.remove('hidden');document.title='COMING SOON | JAMPO CUP';}else{unpublished.classList.add('hidden');content.classList.remove('hidden');document.title=team+' | JAMPO CUP';document.getElementById('team-name').textContent=team;document.getElementById('team-emblem').innerHTML=meta.image?`<img src="${meta.image}" alt="${esc(team)} アイコン">`:`<span class="emblem-fallback">${esc(team.slice(0,1))}</span>`;const roster=(data.players||[]).filter(p=>p.team===team).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));document.getElementById('team-roster').innerHTML=roster.length?roster.map(p=>`<a class="roster-card" href="players.html?player=${encodeURIComponent(p.id)}"><div class="roster-photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:`<span style="align-self:center;font-size:36px;font-weight:900;color:#bbb">${esc((p.name||'?').slice(0,1))}</span>`}</div><div class="roster-name">${esc(p.name||'選手名未登録')}</div></a>`).join(''):'<p style="grid-column:1/-1;color:#777">出場選手はまだ登録されていません。</p>';document.getElementById('team-intro').textContent=meta.intro||'チーム紹介はまだ登録されていません。';}</script></body></html>
