<section class="hero" style="min-height:300px">
  <span class="hex h1">⬡</span><span class="hex h2">⬡</span><div class="hero-brush" aria-hidden="true"></div>
  <div class="hero-content"><div class="eyebrow">JAMPO CUP ROSTER</div><h1 class="hero-mark" style="font-size:clamp(58px,9vw,100px)">出場選手一覧</h1><div class="hero-en">PLAYERS</div><h2>雀蜂杯を戦う選手たち</h2><p>所属事務所ごとに選手を紹介します。</p><div class="hero-actions"><a class="btn primary" href="index.html">トップページへ戻る</a></div></div>
</section>
<section class="section" id="roster"><div class="wrap" id="player-groups"></div></section>
</main>
<footer><div class="wrap footer-inner"><div><a class="brand" href="#home"><span class="bee">蜂</span><span><span class="brand-title">雀蜂杯</span><span class="brand-sub">JAMPO CUP</span></span></a><div class="footer-note">© 2026 JAMPO CUP. All rights reserved.</div></div><div class="footer-links"><a href="#news">NEWS</a><a href="#teams">TEAMS</a><a href="#schedule">SCHEDULE</a><a href="#about">ABOUT</a></div></div></footer>
<script>
const menu=document.getElementById('menu'), nav=document.getElementById('nav');
menu.addEventListener('click',()=>nav.classList.toggle('open'));
nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const target=document.querySelector(a.getAttribute('href'));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth'});}}));


const JAK_KEY='jakuhouCupDataV8';
function jakEsc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jakFmt(n){n=Number(n)||0;return (n>0?'+':'')+n.toFixed(1)}
function jakGet(){const def={teams:['チームA','チームB','チームC','チームD'],teamMeta:{'チームA':{color:'#111111'},'チームB':{color:'#111111'},'チームC':{color:'#111111'},'チームD':{color:'#111111'}},players:[{id:'p1',name:'選手名を登録',team:'チームA',profile:''},{id:'p2',name:'選手名を登録',team:'チームB',profile:''},{id:'p3',name:'選手名を登録',team:'チームC',profile:''},{id:'p4',name:'選手名を登録',team:'チームD',profile:''}],results:[],manualTeamPoints:{},manualPoints:{},manualBest:{},news:[],settings:{start:25000,return:30000,uma:[30,10,-10,-30],oka:20}};try{const d={...def,...JSON.parse(localStorage.getItem(JAK_KEY)||'{}')};d.teamMeta=d.teamMeta||{};d.agencyMeta=d.agencyMeta||{};(d.teams||[]).forEach(t=>{d.teamMeta[t]={...(d.teamMeta[t]||{}),color:'#111111'}});return d}catch(e){(def.teams||[]).forEach(t=>{def.teamMeta[t]={...(def.teamMeta[t]||{}),color:'#111111'}});return def}}
function jakCompute(d){let ps={};d.players.forEach(p=>ps[p.id]={player:p,points:0,best:null,matches:0});let ts={};d.teams.forEach(t=>ts[t]=0);for(const r of d.results||[]){let sorted=[...r.entries].sort((a,b)=>Number(b.score)-Number(a.score));sorted.forEach((e,i)=>{if(!ps[e.playerId])return;let place=i+1,pt=(Number(e.score)-Number(d.settings.return||30000))/1000+(d.settings.uma||[30,10,-10,-30])[place-1]+(place===1?Number(d.settings.oka||0):0);ps[e.playerId].points+=pt;ps[e.playerId].matches++;ps[e.playerId].best=ps[e.playerId].best===null?Number(e.score):Math.max(ps[e.playerId].best,Number(e.score));ts[ps[e.playerId].player.team]=(ts[ps[e.playerId].player.team]||0)+pt})}Object.values(ps).forEach(s=>{s.points+=Number(d.manualPoints?.[s.player.id]||0);if(d.manualBest?.[s.player.id]!==undefined)s.best=Math.max(s.best??-Infinity,Number(d.manualBest[s.player.id]))});Object.keys(ts).forEach(t=>ts[t]+=Number(d.manualTeamPoints?.[t]||0));return {players:Object.values(ps),teams:d.teams.map(t=>({name:t,points:ts[t]||0, matches:(d.results||[]).filter(r=>r.entries.some(e=>ps[e.playerId]?.player.team===t)).length}))}}
function jakRows(table,rows){if(!table)return;const body=table.querySelector('tbody');body.innerHTML=rows;}
function jakRender(){let d=jakGet(),c=jakCompute(d);const teamTable=document.getElementById('team-ranking-table');if(teamTable){let ts=[...c.teams].sort((a,b)=>b.points-a.points);jakRows(teamTable,ts.map((t,i)=>`<tr class="${i===0?'rank-first':''}"><td><span class="rank-medal">${i+1}</span></td><td><span class="team-chip ${i===0?'chip-yellow':i===1?'chip-black':i===2?'chip-blue':'chip-red'}">${['蜂','狼','龍','鳳'][d.teams.indexOf(t.name)]||'雀'}</span><strong>${jakEsc(t.name)}</strong></td><td>${t.matches}</td><td class="points">${jakFmt(t.points)} <small>pt</small></td></tr>`).join(''));}
function renderPlayers(table,type){if(!table)return;let list=[...c.players].sort((a,b)=>type==='best'?((b.best??-Infinity)-(a.best??-Infinity)):b.points-a.points);let showAll=table.dataset.showall==='1';let visible=showAll?list:list.slice(0,8);jakRows(table,visible.map((s,i)=>`<tr><td><span class="rank-medal">${i+1}</span></td><td><strong>${jakEsc(s.player.name)}</strong></td><td><span class="team-tag">${jakEsc(s.player.team)}</span></td><td class="points">${type==='best'?(s.best===null?'—':jakEsc(s.best)):(jakFmt(s.points)+' <small>pt</small>')}</td></tr>`).join(''));let panel=table.closest('.ranking-panel');if(panel&&!panel.querySelector('[data-jak-showall]')&&list.length>8){let b=document.createElement('button');b.className='more';b.style.cssText='border:0;border-bottom:2px solid var(--yellow);background:white;cursor:pointer;margin:10px 20px';b.textContent='8位以下を表示 ＋';b.dataset.jakShowall=type;b.onclick=()=>{table.dataset.showall='1';b.textContent='上位8位のみ表示 −';b.onclick=()=>{table.dataset.showall='0';jakRender()};jakRender()};panel.appendChild(b)}else if(panel&&list.length<=8){let b=panel.querySelector('[data-jak-showall]');if(b)b.remove()}}
renderPlayers(document.getElementById('individual-ranking-table'),'points');renderPlayers(document.getElementById('best-ranking-table'),'best');
// Reflect registered news in the existing news list, without changing its design.
let newsList=document.getElementById('news-list');if(newsList&&d.news?.length){let defaults=newsList.innerHTML;newsList.innerHTML=d.news.map(n=>`<article class="news-item"><div class="date">${jakEsc(n.date||'')}</div><div><span class="news-label">お知らせ</span><h4>${jakEsc(n.title)}</h4><p style="font-size:11px;color:#666;margin:4px 0 0">${jakEsc(n.body||'')}</p></div></article>`).join('')+defaults;}
}

function socialIcon(kind){if(kind==='tiktok')return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 6.3a6.7 6.7 0 0 1-4.1-4.1V2h-4v13.1a2.8 2.8 0 1 1-2.8-2.8c.4 0 .8.1 1.1.2V8.4a7 7 0 1 0 5.7 6.9V9a10.5 10.5 0 0 0 4.1 1z"/></svg>';return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.3-8.4L1.8 2h6.5l4.5 6.8zM17.8 19.8h1.7L7.2 4.1H5.4z"/></svg>'}
function validSocial(url,kind){try{const u=new URL(url);return /^https?:$/.test(u.protocol)&&(kind==='tiktok'?/tiktok\.com$/i.test(u.hostname.replace(/^www\./,'')):/^(x\.com|twitter\.com)$/i.test(u.hostname.replace(/^www\./,'')))}catch{return false}}
function socialLinks(p,detail=false){let out='';if(validSocial(p.tiktok,'tiktok'))out+=`<a class="social-link" href="${jakEsc(p.tiktok)}" target="_blank" rel="noopener noreferrer" aria-label="${jakEsc(p.name)}のTikTok" title="TikTok" onclick="event.stopPropagation()">${socialIcon('tiktok')}</a>`;if(validSocial(p.x,'x'))out+=`<a class="social-link" href="${jakEsc(p.x)}" target="_blank" rel="noopener noreferrer" aria-label="${jakEsc(p.name)}のX" title="X" onclick="event.stopPropagation()">${socialIcon('x')}</a>`;return out}
function renderRoster(){const host=document.getElementById('player-groups');if(!host)return;const d=jakGet();const players=d.players||[];const playerId=new URLSearchParams(location.search).get('player');if(playerId){const p=players.find(x=>String(x.id)===playerId);if(!p){host.innerHTML='<p>選手が見つかりませんでした。</p><a class="back-roster" href="players.html">← 選手一覧に戻る</a>';return}document.querySelector('.hero-mark').textContent=p.name||'選手プロフィール';document.querySelector('.hero-en').textContent='PLAYER PROFILE';document.querySelector('.hero-content h2').textContent=p.agency||'所属事務所未登録';document.querySelector('.hero-content p').textContent='選手プロフィール';host.innerHTML=`<a class="back-roster" href="players.html">← 選手一覧に戻る</a><article class="player-detail"><div class="player-detail-portrait">${p.image?`<img src="${jakEsc(p.image)}" alt="${jakEsc(p.name)}" style="transform:translate(${Number(p.imageLayout?.x||0)}%,${Number(p.imageLayout?.y||0)}%) scale(${Number(p.imageLayout?.scale||1)});transform-origin:center center">`:`<span class="portrait-placeholder">${jakEsc((p.name||'?').slice(0,1))}</span>`}</div><div class="player-detail-copy"><div class="player-debut">${jakEsc(p.agency||'所属事務所未登録')}</div><h2>${jakEsc(p.name||'選手名未登録')}</h2><div class="player-detail-meta">デビュー日：${jakEsc(p.debutDate||p.debutMonth||'未登録')}</div><div class="player-profile-fields">${[["好きな役",p.favoriteRole],["意気込み",p.enthusiasm],["リスナー様へ一言",p.listenerMessage]].map(([label,value])=>`<section class="profile-field"><h3>${label}</h3><p>${jakEsc(value||'未登録')}</p></section>`).join('')}</div><div class="detail-socials">${socialLinks(p,true)}</div></div></article>`;return}const groupsMap=new Map();players.forEach(p=>{const agency=String(p.agency||'所属事務所未登録').trim()||'所属事務所未登録';if(!groupsMap.has(agency))groupsMap.set(agency,[]);groupsMap.get(agency).push(p)});const groups=[...groupsMap.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([agency,list])=>({agency,players:list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'))}));if(!groups.length){host.innerHTML='<p>選手はまだ登録されていません。</p>';return}host.innerHTML=groups.map(g=>`<section class="player-group"><h2 class="player-group-title">${d.agencyMeta?.[g.agency]?.image?`<img src="${jakEsc(d.agencyMeta[g.agency].image)}" alt="" style="width:42px;height:42px;object-fit:contain;flex:none">`: ''}${jakEsc(g.agency)} <small>AGENCY ROSTER</small></h2><div class="players-grid">${g.players.map(p=>`<article class="player-card" role="link" tabindex="0" aria-label="${jakEsc(p.name)}の詳細ページへ" data-player-detail="${jakEsc(p.id)}"><div class="player-portrait">${p.image?`<img loading="lazy" src="${jakEsc(p.image)}" alt="${jakEsc(p.name)}の立ち絵" style="transform:translate(${Number(p.imageLayout?.x||0)}%,${Number(p.imageLayout?.y||0)}%) scale(${Number(p.imageLayout?.scale||1)});transform-origin:center center">`:`<span class="portrait-placeholder">${jakEsc((p.name||'?').slice(0,1))}</span>`}</div><div class="player-info"><h3>${jakEsc(p.name||'選手名未登録')}</h3><div class="player-debut">デビュー月<br><strong>${jakEsc(p.debutMonth||'未登録')}</strong></div><div class="player-socials">${socialLinks(p)}</div></div></article>`).join('')}</div></section>`).join('');host.querySelectorAll('[data-player-detail]').forEach(card=>{const go=()=>location.href='players.html?player='+encodeURIComponent(card.dataset.playerDetail);card.addEventListener('click',go);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})})}
if(document.getElementById('players-page')){renderRoster();window.addEventListener('storage',e=>{if(e.key===JAK_KEY)renderRoster()});}else{jakRender();window.addEventListener('storage',e=>{if(e.key===JAK_KEY)jakRender()});}

</script>
<script>(function(){try{const d=JSON.parse(localStorage.getItem('jakuhouCupDataV8')||'{}');if(d.siteLogo){document.querySelectorAll('.brand .bee').forEach(el=>{el.innerHTML='<img src="'+String(d.siteLogo).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'" alt="雀蜂杯ロゴ" style="width:100%;height:100%;object-fit:contain">';});}}catch(e){console.warn('ロゴの読み込みに失敗しました',e)}})();</script></body>
</html>
