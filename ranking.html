<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雀蜂杯｜公式サイト</title><style>
:root{--yellow:#f2cc24;--ink:#191914;--paper:#f7f4e8;--muted:#777466;--line:#e4dfce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}a{color:inherit;text-decoration:none}.top{background:#171713;color:white;border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:5}.nav{max-width:1120px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-family:"Yu Mincho",serif;font-size:27px;font-weight:900;letter-spacing:.13em;margin-right:auto}.brand span{color:var(--yellow)}.nav a:not(.brand){font-size:13px;color:#f3f0e4}.nav a:hover{color:var(--yellow)}.wrap{max-width:1120px;margin:auto;padding:26px 20px}.hero{min-height:330px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:20px;overflow:hidden;background:linear-gradient(110deg,#fffdf5 0%,#fffdf5 56%,#f3e7a8 100%);border-bottom:1px solid var(--line);padding:34px max(20px,calc((100vw - 1080px)/2)) 28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.24em;color:#8c7100}.brush-title{font-family:"Yu Mincho",YuMincho,"Hiragino Mincho ProN",serif;font-weight:1000;font-size:clamp(50px,8vw,94px);letter-spacing:.09em;line-height:1.05;margin:12px 0;text-shadow:1px 1px #fff,2px 2px #e6dcae}.brush-title:after{content:"";display:block;width:240px;max-width:80%;height:7px;background:var(--yellow);transform:rotate(-2deg);margin-top:12px;clip-path:polygon(0 18%,100% 0,96% 72%,4% 100%)}.tagline{font-family:"Yu Mincho",serif;font-size:20px;font-weight:800}.bee-wrap{display:flex;align-items:center;justify-content:center}.bee{width:min(100%,360px);filter:drop-shadow(5px 9px 1px #b6a04a55)}.cta{display:inline-block;background:var(--ink);color:white;padding:12px 18px;margin-top:12px;font-weight:700;border:1px solid var(--ink)}.cta:hover{background:var(--yellow);color:var(--ink)}.section-title{display:flex;align-items:end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin:32px 0 18px}.section-title h2{font-family:"Yu Mincho",serif;font-size:27px;margin:0}.section-title small{color:var(--muted);letter-spacing:.14em}.panel{background:#fffdf7;border:1px solid var(--line);padding:18px;margin-bottom:18px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:490px}th{background:#24241e;color:#fff;padding:11px 12px;font-size:13px;text-align:left}th:first-child,td:first-child{text-align:center;width:65px}td{padding:12px;border-bottom:1px solid var(--line);font-size:14px}tbody tr:nth-child(1) td:first-child{font-weight:900;color:#a37f00}td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:750}.pos{color:#187547}.neg{color:#b33c28}.showall{display:block;text-align:center;border:1px solid #b7a64e;background:#fff8d4;padding:12px;margin-top:12px;font-weight:800;cursor:pointer}.showall:hover{background:var(--yellow)}.hidden-row{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.team-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.team{padding:18px;background:#fffdf7;border-top:5px solid var(--yellow);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:800}.team small{display:block;color:var(--muted);font-weight:500;margin-top:6px}.footer{background:#191914;color:#eee8d6;padding:30px 20px;text-align:center;font-size:12px;margin-top:36px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{font:inherit;padding:10px;border:1px solid #cfc8b2;background:#fffdf7;width:100%;border-radius:0}.btn{background:var(--ink);color:white;border:0;padding:11px 16px;font-weight:800;cursor:pointer}.btn.yellow{background:var(--yellow);color:var(--ink)}.btn.danger{background:#8d2d20}.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{background:#fff5c9;padding:12px;border-left:4px solid var(--yellow);font-size:13px;line-height:1.7}.subnav{display:flex;gap:10px;flex-wrap:wrap}.subnav a{padding:9px 12px;background:#fff;border:1px solid var(--line);font-weight:700}.subnav a.active{background:var(--yellow)}.record{padding:12px 0;border-bottom:1px solid var(--line)}.record small{color:var(--muted)}/* Oversized broadcast-style team standings */
.team-ranking-panel{padding:40px 36px;overflow:hidden}.team-ranking-title{font-size:clamp(38px,5vw,64px);margin:0 0 30px;font-weight:1000;letter-spacing:.02em}.team-ranking-table{min-width:1450px;table-layout:auto}.team-ranking-table th{font-size:clamp(24px,2vw,32px);padding:26px 28px;letter-spacing:.06em;white-space:nowrap}.team-ranking-table td{font-size:clamp(38px,3vw,54px);padding:38px 28px;font-weight:900;white-space:nowrap}.team-ranking-table td:first-child{font-size:clamp(48px,4vw,72px);width:130px}.team-ranking-table .team-name-cell{font-size:clamp(42px,3.5vw,64px);font-weight:1000;min-width:440px}.team-ranking-table .team-icon-cell{width:150px;text-align:center}.team-ranking-table .team-icon{display:block;width:clamp(84px,8vw,128px);height:clamp(84px,8vw,128px);object-fit:contain;margin:auto}.team-ranking-table .team-icon-fallback{display:grid;place-items:center;width:clamp(84px,8vw,128px);height:clamp(84px,8vw,128px);margin:auto;background:#111;color:#fff;font-size:clamp(42px,4vw,68px);font-weight:1000}.team-ranking-table .team-points{font-size:clamp(54px,4.5vw,78px);font-weight:1000;white-space:nowrap}.team-ranking-table .team-diff{font-size:clamp(42px,3.5vw,60px);white-space:nowrap}.team-ranking-table .team-matches{font-size:clamp(38px,3vw,52px);text-align:center;white-space:nowrap}.team-ranking-table tbody tr{height:180px}.team-ranking-table tbody tr:first-child{background:#fff8d4}.team-ranking-table tbody tr:first-child td:first-child{color:#9a7600}.team-ranking-table tbody tr:first-child .team-name-cell{letter-spacing:.04em}@media(max-width:720px){.team-ranking-panel{padding:22px 14px}.team-ranking-title{font-size:36px}.team-ranking-table{min-width:1250px}.team-ranking-table th{font-size:23px;padding:20px 20px}.team-ranking-table td{font-size:38px;padding:28px 20px}.team-ranking-table td:first-child{font-size:48px;width:100px}.team-ranking-table .team-name-cell{font-size:42px;min-width:330px}.team-ranking-table .team-icon-cell{width:110px}.team-ranking-table .team-icon,.team-ranking-table .team-icon-fallback{width:80px;height:80px;font-size:42px}.team-ranking-table .team-points{font-size:52px}.team-ranking-table .team-diff{font-size:38px}.team-ranking-table .team-matches{font-size:36px}.team-ranking-table tbody tr{height:140px}}@media(max-width:720px){.hero{grid-template-columns:1fr;padding:28px 20px}.bee{width:230px}.grid{grid-template-columns:1fr}.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{gap:12px}.brand{width:100%}.nav a:not(.brand){font-size:12px}.form-grid{grid-template-columns:1fr}.section-title h2{font-size:23px}}

const KEY='jakuhouCupDataV8';const defaultData={teams:['チームA','チームB','チームC','チームD'],teamMeta:{'チームA':{color:'#111111'},'チームB':{color:'#111111'},'チームC':{color:'#111111'},'チームD':{color:'#111111'}},players:[{id:'p1',name:'選手名を登録',team:'チームA',profile:'プロフィール未登録'},{id:'p2',name:'選手名を登録',team:'チームB',profile:'プロフィール未登録'},{id:'p3',name:'選手名を登録',team:'チームC',profile:'プロフィール未登録'},{id:'p4',name:'選手名を登録',team:'チームD',profile:'プロフィール未登録'}],results:[],manualTeamPoints:{},manualPoints:{},manualBest:{},news:[],settings:{start:25000,return:30000,uma:[30,10,-10,-30],oka:20}};function getData(){try{const d={...defaultData,...JSON.parse(localStorage.getItem(KEY)||'{}')};d.teamMeta=d.teamMeta||{};(d.teams||[]).forEach(t=>{d.teamMeta[t]={...(d.teamMeta[t]||{}),color:'#111111'}});return d}catch(e){const d=structuredClone(defaultData);(d.teams||[]).forEach(t=>{d.teamMeta[t]={...(d.teamMeta[t]||{}),color:'#111111'}});return d}}function saveData(d){localStorage.setItem(KEY,JSON.stringify(d))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){let x=Number(n)||0;return (x>0?'+':'')+x.toFixed(1)}function beeSvg(){return `<svg class="bee" viewBox="0 0 380 300" role="img" aria-label="鳥獣戯画風の写実的な蜂の墨絵"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe878"/><stop offset=".5" stop-color="#e0ae13"/><stop offset="1" stop-color="#7b5a08"/></linearGradient></defs><g stroke="#211f17" stroke-linecap="round" stroke-linejoin="round"><path d="M151 111 C108 40 42 47 67 104 C82 133 119 136 157 139Z" fill="#eee9d9" stroke-width="4"/><path d="M177 104 C192 34 270 42 257 91 C247 120 218 133 183 137Z" fill="#f7f1df" stroke-width="4"/><path d="M152 117 C175 88 219 103 236 139 C255 179 227 223 189 238 C160 222 128 189 135 151Z" fill="url(#gold)" stroke-width="5"/><path d="M145 134 Q173 147 220 131 L231 157 Q190 178 137 160Z" fill="#201f18" stroke-width="2"/><path d="M144 179 Q185 198 237 173 L224 199 Q190 219 158 204Z" fill="#201f18" stroke-width="2"/><path d="M155 118 Q141 91 159 76 Q177 65 195 85 Q206 102 192 121Z" fill="#24221a" stroke-width="4"/><path d="M164 82 Q146 54 125 66 M183 81 Q199 52 221 61" fill="none" stroke-width="4"/><circle cx="159" cy="95" r="5" fill="#f9df64" stroke-width="2"/><circle cx="183" cy="94" r="5" fill="#f9df64" stroke-width="2"/><path d="M164 108 Q174 116 185 107" fill="none" stroke-width="3"/><path d="M235 176 Q279 191 303 163 L286 199 Q261 214 225 205Z" fill="#28251b" stroke-width="4"/><path d="M300 164 L324 144 L315 176Z" fill="#f1cf36" stroke-width="3"/><path d="M157 203 L129 239 L153 231 L170 216 M201 217 L218 255 L226 230" fill="none" stroke-width="7"/><path d="M149 137 Q105 153 104 182 M212 145 Q251 151 258 171" fill="none" stroke-width="5"/><path d="M61 255 Q123 270 176 256 T315 255" fill="none" stroke="#9d7b13" stroke-width="2" stroke-dasharray="3 8"/></g><g fill="#fff7d2" opacity=".7"><path d="M82 86 Q108 72 130 108 Q101 115 82 86Z"/><path d="M207 80 Q236 59 246 83 Q229 102 207 80Z"/></g></svg>`}
function compute(d){let stats={};d.players.forEach(p=>stats[p.id]={player:p,points:0,best:null,matches:0});let team={},teamMatches={};d.teams.forEach(t=>{team[t]=0;teamMatches[t]=0});for(const r of d.results){let sorted=[...r.entries].sort((a,b)=>Number(b.score)-Number(a.score));sorted.forEach((e,i)=>{if(!stats[e.playerId])return;let place=i+1,pt=(Number(e.score)-d.settings.return)/1000+d.settings.uma[place-1]+(place===1?d.settings.oka:0);stats[e.playerId].points+=pt;stats[e.playerId].matches++;teamMatches[stats[e.playerId].player.team]=(teamMatches[stats[e.playerId].player.team]||0)+1;stats[e.playerId].best=stats[e.playerId].best===null?Number(e.score):Math.max(stats[e.playerId].best,Number(e.score));team[stats[e.playerId].player.team]=(team[stats[e.playerId].player.team]||0)+pt})}Object.values(stats).forEach(s=>{s.points+=Number(d.manualPoints[s.player.id]||0);if(d.manualBest[s.player.id]!==undefined&&d.manualBest[s.player.id]!=='' )s.best=Math.max(s.best??-Infinity,Number(d.manualBest[s.player.id]));});Object.keys(team).forEach(t=>team[t]+=Number(d.manualTeamPoints[t]||0));return {players:Object.values(stats),team,teamMatches}}
function tableRows(rows,cols){return `<div class="table-scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}function rankingTable(items,type,all=false){const pubData=getData();let list=[...items].sort((a,b)=>type==='best'?((b.best??-Infinity)-(a.best??-Infinity)):b.points-a.points);if(type==='team')list=[...items].sort((a,b)=>b.points-a.points);let visible=all?list:list.slice(0,8);return tableRows(visible.map((x,i)=>{let name=type==='team'?x.name:x.player.name,team=type==='team'?x.name:x.player.team,score=type==='team'?x.points:type==='best'?(x.best??'—'):x.points;return `<tr><td>${i+1}</td><td>${esc(name)}</td><td>${(pubData.teamMeta?.[team]||{}).published?esc((pubData.teamMeta?.[team]||{}).shortName||team):'COMING SOON'}</td><td class="num ${Number(score)<0?'neg':Number(score)>0?'pos':''}">${score==='—'?'—':type==='best'?esc(score):fmt(score)}</td></tr>`}).join(''),['順位','選手名','チーム',type==='best'?'最高得点':'スコア'].map((s,i)=>type==='team'&&i===1?'チーム名':s))}
function rankingsSection(d,full=false){let c=compute(d);let teams=d.teams.map(t=>({name:t,points:c.team[t]||0,matches:c.teamMatches[t]||0})).sort((a,b)=>b.points-a.points);let leader=teams[0]?.points||0;return `<section id="ranking"><div class="section-title"><h2>ランキング</h2><small>RANKINGS</small></div><div class="panel team-ranking-panel"><h3 class="team-ranking-title">チームランキング</h3><div class="table-scroll"><table class="team-ranking-table"><thead><tr><th>順位</th><th colspan="2">チーム</th><th style="text-align:right">ポイント</th><th style="text-align:right">差</th><th style="text-align:center">試合数</th></tr></thead><tbody>${teams.map((t,i)=>{const meta=d.teamMeta?.[t.name]||{};const icon=meta.image?`<img class="team-icon" src="${meta.image}" alt="${esc(t.name)} アイコン">`:`<span class="team-icon-fallback">${esc(t.name.slice(0,1))}</span>`;return `<tr><td>${i+1}</td><td class="team-icon-cell">${icon}</td><td class="team-name-cell">${(d.teamMeta?.[t.name]||{}).published?esc((d.teamMeta?.[t.name]||{}).shortName||t.name):'COMING SOON'}</td><td class="num team-points ${t.points<0?'neg':'pos'}">${fmt(t.points)}</td><td class="num team-diff ${t.points-leader<0?'neg':'pos'}">${fmt(t.points-leader)}</td><td class="team-matches">${t.matches}/48</td></tr>`}).join('')}</tbody></table></div></div><div class="grid"><div class="panel"><h3>個人ポイントランキング</h3>${rankingTable(c.players,'points',full)}${!full&&c.players.length>8?'<button class="showall" data-expand="points">8位以下を表示　＋</button>':''}</div><div class="panel"><h3>最高スコアランキング</h3>${rankingTable(c.players,'best',full)}${!full&&c.players.length>8?'<button class="showall" data-expand="best">8位以下を表示　＋</button>':''}</div></div></section>`}
function home(){let d=getData();document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">JAPANESE MAHJONG LEAGUE</div><h1 class="brush-title">雀蜂杯</h1><div class="tagline">一打に、想いを込めろ。</div><p>勝負の一瞬に、すべてを懸ける。</p><a class="cta" href="players.html">出場選手一覧を見る →</a></div><div class="bee-wrap">${beeSvg()}</div></section><div class="wrap">${rankingsSection(d)}<section id="news"><div class="section-title"><h2>最新情報</h2><small>NEWS</small></div><div class="panel">${d.news.length?d.news.map(n=>`<div class="record"><small>${esc(n.date)}</small><div><b>${esc(n.title)}</b></div><div>${esc(n.body)}</div></div>`).join(''):'最新情報は準備中です。'}</div></section><section><div class="section-title"><h2>参戦チーム</h2><small>TEAMS</small></div><div class="team-grid">${d.teams.map(t=>`<div class="team">${esc(t)}<small>TEAM</small></div>`).join('')}</div></section></div>`;document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{location.href='ranking.html?view='+b.dataset.expand})}
function playersPage(){let d=getData();document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-title"><h2>出場選手一覧</h2><small>PLAYERS</small></div><p>雀蜂杯に出場する全選手のプロフィール。</p><div class="team-grid">${d.players.map(p=>`<article class="team"><div style="font-size:11px;color:#8b7200">${esc(p.team)}</div><h3>${esc(p.name)}</h3><small>${esc(p.profile||'プロフィール未登録')}</small></article>`).join('')}</div><p><a class="cta" href="index.html">← トップへ戻る</a></p></div>`}
function rankingPage(){let d=getData(),v=new URLSearchParams(location.search).get('view')||'points',c=compute(d),items=[...c.players].sort((a,b)=>v==='best'?((b.best??-Infinity)-(a.best??-Infinity)):b.points-a.points);document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-title"><h2>${v==='best'?'最高スコアランキング':'個人ポイントランキング'}</h2><small>FULL RANKING</small></div><div class="panel">${rankingTable(items,v,true)}</div><a class="cta" href="index.html#ranking">← ランキングへ戻る</a></div>`}
function adminPage(){let d=getData();let playerOpts=d.players.map(p=>`<option value="${p.id}">${esc(p.name)}（${esc(p.team)}）</option>`).join('');document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-title"><h2>管理者画面</h2><small>ADMIN CONSOLE</small></div><div class="notice">この版はブラウザの localStorage に保存します。同じブラウザ内で表示が反映されますが、複数端末や一般公開サイト全体への同期にはサーバー・データベースが別途必要です。管理者画面にも本番用ログイン認証はまだありません。</div><div class="subnav" style="margin:18px 0"><a href="#players">選手管理</a><a href="#settings">ルール設定</a><a href="#result">半荘結果入力</a><a href="#manual">手動調整</a><a href="#newsadmin">お知らせ</a><a href="#backup">データ管理</a></div><section id="players" class="panel"><h3>選手管理</h3><div class="form-grid"><div class="field"><label>選手名</label><input id="pname" placeholder="選手名"></div><div class="field"><label>所属チーム</label><select id="pteam">${d.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>プロフィール</label><input id="pprofile" placeholder="得意な打ち筋・紹介文など"></div></div><div class="row-actions"><button class="btn yellow" id="addplayer">選手を追加</button></div><div id="playerlist">${d.players.map(p=>`<div class="record"><b>${esc(p.name)}</b> — ${esc(p.team)}<br><small>${esc(p.profile||'')}</small> <button class="btn danger" data-delplayer="${p.id}">削除</button></div>`).join('')}</div></section><section id="settings" class="panel"><h3>半荘ポイント計算ルール</h3><p>初期持ち点・返し点・ウマ・オカを設定できます。初期設定は Mリーグ形式を想定した値です。</p><div class="form-grid"><div class="field"><label>開始点</label><input id="start" type="number" value="${d.settings.start}"></div><div class="field"><label>返し点</label><input id="return" type="number" value="${d.settings.return}"></div><div class="field"><label>1位ウマ</label><input id="uma1" type="number" value="${d.settings.uma[0]}"></div><div class="field"><label>2位ウマ</label><input id="uma2" type="number" value="${d.settings.uma[1]}"></div><div class="field"><label>3位ウマ</label><input id="uma3" type="number" value="${d.settings.uma[2]}"></div><div class="field"><label>4位ウマ</label><input id="uma4" type="number" value="${d.settings.uma[3]}"></div><div class="field"><label>オカ（1位加算）</label><input id="oka" type="number" value="${d.settings.oka}"></div></div><div class="row-actions"><button class="btn yellow" id="savesettings">ルールを保存</button></div><p class="notice">計算式： (最終持ち点 − 返し点) ÷ 1,000 ＋ 順位ウマ ＋ 1位オカ。点数は千点単位で計算します。返し点はルールの記録用で、計算は返し点を基準にしています。</p></section><section id="result" class="panel"><h3>半荘結果入力</h3><p>1半荘につき4人の選手と最終持ち点を入力。保存すると個人ポイント・チームポイント・最高得点が自動更新されます。</p><div class="field"><label>対局名・半荘番号</label><input id="rname" placeholder="第1節 第1回戦"></div><div class="form-grid" id="entries">${[0,1,2,3].map(i=>`<div class="panel"><b>${i+1}人目</b><div class="field"><label>選手</label><select id="rp${i}">${playerOpts}</select></div><div class="field"><label>最終持ち点</label><input id="rs${i}" type="number" value="${i===0?45000:i===1?30000:i===2?15000:10000}"></div></div>`).join('')}</div><div class="row-actions"><button class="btn yellow" id="saveresult">半荘結果を登録</button></div><div id="resultmsg"></div></section><section id="manual" class="panel"><h3>ポイント・最高得点の手動調整</h3><div class="form-grid"><div class="field"><label>選手</label><select id="mpplayer">${playerOpts}</select></div><div class="field"><label>個人ポイントへの加算・減算</label><input id="mpvalue" type="number" step="0.1" value="0"></div><div class="field"><label>最高得点の手動登録</label><input id="bestvalue" type="number" placeholder="例：72000"></div><div class="field"><label>チームポイントの調整先</label><select id="mtteam">${d.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>チームポイントへの加算・減算</label><input id="mtvalue" type="number" step="0.1" value="0"></div></div><div class="row-actions"><button class="btn yellow" id="savemanual">手動調整を保存</button></div></section><section id="newsadmin" class="panel"><h3>最新情報の追加</h3><div class="form-grid"><div class="field"><label>日付</label><input id="ndate" type="date"></div><div class="field"><label>タイトル</label><input id="ntitle" placeholder="お知らせタイトル"></div><div class="field" style="grid-column:1/-1"><label>本文</label><textarea id="nbody" rows="3"></textarea></div></div><div class="row-actions"><button class="btn yellow" id="addnews">お知らせを追加</button></div></section><section id="backup" class="panel"><h3>データ管理</h3><div class="row-actions"><button class="btn" id="exportdata">JSONを書き出す</button><label class="btn" for="importfile">JSONを読み込む</label><input id="importfile" type="file" accept="application/json" hidden><button class="btn danger" id="resetdata">初期データに戻す</button></div><textarea id="jsonout" rows="5" style="width:100%;margin-top:12px;display:none"></textarea></section></div>`;wireAdmin()}
function wireAdmin(){let d=getData(),$=id=>document.getElementById(id),refresh=()=>{saveData(d);adminPage()};$('addplayer').onclick=()=>{let name=$('pname').value.trim();if(!name)return alert('選手名を入力してください');d.players.push({id:'p'+Date.now(),name,team:$('pteam').value,profile:$('pprofile').value});refresh()};document.querySelectorAll('[data-delplayer]').forEach(b=>b.onclick=()=>{if(confirm('この選手を削除しますか？')){d.players=d.players.filter(p=>p.id!==b.dataset.delplayer);refresh()}});$('savesettings').onclick=()=>{d.settings={start:+$('start').value,return:+$('return').value,uma:[+$('uma1').value,+$('uma2').value,+$('uma3').value,+$('uma4').value],oka:+$('oka').value};refresh()};$('saveresult').onclick=()=>{let entries=[0,1,2,3].map(i=>({playerId:$('rp'+i).value,score:+$('rs'+i).value}));if(new Set(entries.map(e=>e.playerId)).size!==4)return alert('4人別々の選手を選択してください');if(entries.some(e=>!Number.isFinite(e.score)))return alert('持ち点を入力してください');d.results.push({id:Date.now(),name:$('rname').value||`半荘${d.results.length+1}`,date:new Date().toISOString().slice(0,10),entries});saveData(d);$('resultmsg').innerHTML='<p class="pos">登録しました。ランキングに自動反映されました。</p>';};$('savemanual').onclick=()=>{let id=$('mpplayer').value;d.manualPoints[id]=+$('mpvalue').value;if($('bestvalue').value!=='')d.manualBest[id]=+$('bestvalue').value;let t=$('mtteam').value;d.manualTeamPoints[t]=Number(d.manualTeamPoints[t]||0)+ +$('mtvalue').value;saveData(d);alert('手動調整を保存しました')};$('addnews').onclick=()=>{let title=$('ntitle').value.trim();if(!title)return alert('タイトルを入力してください');d.news.unshift({date:$('ndate').value||new Date().toISOString().slice(0,10),title,body:$('nbody').value});saveData(d);alert('お知らせを追加しました')};$('exportdata').onclick=()=>{$('jsonout').style.display='block';$('jsonout').value=JSON.stringify(d,null,2)};$('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{d=JSON.parse(await f.text());saveData(d);alert('読み込みました');adminPage()}catch(err){alert('JSONを読み込めませんでした')}};$('resetdata').onclick=()=>{if(confirm('保存済みの選手・結果・調整をすべて消して初期状態に戻しますか？')){localStorage.removeItem(KEY);adminPage()}}}
if(location.pathname.endsWith('players.html'))playersPage();else if(location.pathname.endsWith('admin.html'))adminPage();else if(location.pathname.endsWith('ranking.html'))rankingPage();else home();
</script><script>(function(){try{const d=JSON.parse(localStorage.getItem('jakuhouCupDataV8')||'{}');if(d.siteLogo){document.querySelectorAll('.brand .bee').forEach(el=>{el.innerHTML='<img src="'+String(d.siteLogo).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'" alt="雀蜂杯ロゴ" style="width:100%;height:100%;object-fit:contain">';});}}catch(e){console.warn('ロゴの読み込みに失敗しました',e)}})();</script></body></html>
