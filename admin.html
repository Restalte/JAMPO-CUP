<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雀蜂杯｜公式サイト</title><style>
:root{--yellow:#f2cc24;--ink:#191914;--paper:#f7f4e8;--muted:#777466;--line:#e4dfce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}a{color:inherit;text-decoration:none}.top{background:#171713;color:white;border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:5}.nav{max-width:1120px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-family:"Yu Mincho",serif;font-size:27px;font-weight:900;letter-spacing:.13em;margin-right:auto}.brand span{color:var(--yellow)}.nav a:not(.brand){font-size:13px;color:#f3f0e4}.nav a:hover{color:var(--yellow)}.wrap{max-width:1120px;margin:auto;padding:26px 20px}.hero{min-height:330px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:20px;overflow:hidden;background:linear-gradient(110deg,#fffdf5 0%,#fffdf5 56%,#f3e7a8 100%);border-bottom:1px solid var(--line);padding:34px max(20px,calc((100vw - 1080px)/2)) 28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.24em;color:#8c7100}.brush-title{font-family:"Yu Mincho",YuMincho,"Hiragino Mincho ProN",serif;font-weight:1000;font-size:clamp(50px,8vw,94px);letter-spacing:.09em;line-height:1.05;margin:12px 0;text-shadow:1px 1px #fff,2px 2px #e6dcae}.brush-title:after{content:"";display:block;width:240px;max-width:80%;height:7px;background:var(--yellow);transform:rotate(-2deg);margin-top:12px;clip-path:polygon(0 18%,100% 0,96% 72%,4% 100%)}.tagline{font-family:"Yu Mincho",serif;font-size:20px;font-weight:800}.bee-wrap{display:flex;align-items:center;justify-content:center}.bee{width:min(100%,360px);filter:drop-shadow(5px 9px 1px #b6a04a55)}.cta{display:inline-block;background:var(--ink);color:white;padding:12px 18px;margin-top:12px;font-weight:700;border:1px solid var(--ink)}.cta:hover{background:var(--yellow);color:var(--ink)}.section-title{display:flex;align-items:end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin:32px 0 18px}.section-title h2{font-family:"Yu Mincho",serif;font-size:27px;margin:0}.section-title small{color:var(--muted);letter-spacing:.14em}.panel{background:#fffdf7;border:1px solid var(--line);padding:18px;margin-bottom:18px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:490px}th{background:#24241e;color:#fff;padding:11px 12px;font-size:13px;text-align:left}th:first-child,td:first-child{text-align:center;width:65px}td{padding:12px;border-bottom:1px solid var(--line);font-size:14px}tbody tr:nth-child(1) td:first-child{font-weight:900;color:#a37f00}td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:750}.pos{color:#187547}.neg{color:#b33c28}.showall{display:block;text-align:center;border:1px solid #b7a64e;background:#fff8d4;padding:12px;margin-top:12px;font-weight:800;cursor:pointer}.showall:hover{background:var(--yellow)}.hidden-row{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.team-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.team{padding:18px;background:#fffdf7;border-top:5px solid var(--yellow);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:800}.team small{display:block;color:var(--muted);font-weight:500;margin-top:6px}.footer{background:#191914;color:#eee8d6;padding:30px 20px;text-align:center;font-size:12px;margin-top:36px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{font:inherit;padding:10px;border:1px solid #cfc8b2;background:#fffdf7;width:100%;border-radius:0}.btn{background:var(--ink);color:white;border:0;padding:11px 16px;font-weight:800;cursor:pointer}.btn.yellow{background:var(--yellow);color:var(--ink)}.btn.danger{background:#8d2d20}.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{background:#fff5c9;padding:12px;border-left:4px solid var(--yellow);font-size:13px;line-height:1.7}.subnav{display:flex;gap:10px;flex-wrap:wrap}.subnav a{padding:9px 12px;background:#fff;border:1px solid var(--line);font-weight:700}.subnav a.active{background:var(--yellow)}.record{padding:12px 0;border-bottom:1px solid var(--line)}.record small{color:var(--muted)}@media(max-width:720px){.hero{grid-template-columns:1fr;padding:28px 20px}.bee{width:230px}.grid{grid-template-columns:1fr}.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{gap:12px}.brand{width:100%}.nav a:not(.brand){font-size:12px}.form-grid{grid-template-columns:1fr}.section-title h2{font-size:23px}}
.image-editor-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:9999;display:grid;place-items:center;padding:18px}.image-editor{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;padding:22px;border-radius:12px}.image-editor-stage{height:min(55vh,480px);min-height:280px;background:linear-gradient(135deg,#fff8d5,#f1ead8 50%,#fffdf5);border:1px solid #ddd;position:relative;overflow:hidden;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center}.image-editor-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;pointer-events:none;transform-origin:center center}.image-editor-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.agency-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}.agency-row img{width:64px;height:64px;object-fit:contain}.player-admin-thumb{width:58px;height:72px;object-fit:contain;background:linear-gradient(135deg,#fff8d5,#f1ead8);vertical-align:middle;margin-right:10px}.portrait-upload-zone{border:2px dashed #c5b76f;background:#fffdf0;padding:14px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;cursor:pointer}.portrait-upload-zone strong{background:#f2cc24;padding:8px 12px}.portrait-upload-zone span,.portrait-upload-zone small{font-size:12px;color:#6d6859}.portrait-upload-zone input{margin-top:5px}.pimage-preview{min-height:54px;display:flex;align-items:center;gap:12px;font-size:12px;color:#777}.pimage-preview img{max-width:90px;max-height:100px;object-fit:contain;background:linear-gradient(135deg,#fff8d5,#f1ead8);border:1px solid #e4dfce}@media(max-width:600px){.image-editor-controls{grid-template-columns:1fr}.image-editor{padding:14px}}

</head><body><header class="top"><nav class="nav"><a class="brand" href="index.html">雀<span>蜂</span>杯</a><a href="index.html#ranking">ランキング</a><a href="players.html">出場選手一覧</a><a href="index.html#news">最新情報</a></nav></header><main id="app"></main><footer class="footer">雀蜂杯 OFFICIAL WEBSITE　｜　一打に、想いを込めろ。</footer><script>
const KEY='jakuhouCupDataV8';const defaultData={teams:['チームA','チームB','チームC','チームD'],teamMeta:{'チームA':{color:'#111111'},'チームB':{color:'#111111'},'チームC':{color:'#111111'},'チームD':{color:'#111111'}},players:[{id:'p1',name:'選手名を登録',team:'チームA',profile:'プロフィール未登録'},{id:'p2',name:'選手名を登録',team:'チームB',profile:'プロフィール未登録'},{id:'p3',name:'選手名を登録',team:'チームC',profile:'プロフィール未登録'},{id:'p4',name:'選手名を登録',team:'チームD',profile:'プロフィール未登録'}],results:[],manualTeamPoints:{},manualPoints:{},manualBest:{},news:[],siteText:{headline:'最高の卓を、最高の仲間と。',subtitle:'個性あふれるチームが集結。麻雀で頂点を目指す、熱き戦いが今、はじまる。',english:'JAMPO CUP'},settings:{start:25000,return:30000,uma:[30,10,-10,-30],oka:20}};function getData(){try{const d={...defaultData,...JSON.parse(localStorage.getItem(KEY)||'{}')};d.teamMeta=d.teamMeta||{};(d.teams||[]).forEach(t=>{d.teamMeta[t]={...(d.teamMeta[t]||{}),color:'#111111'}});return d}catch(e){const d=structuredClone(defaultData);(d.teams||[]).forEach(t=>{d.teamMeta[t]={...(d.teamMeta[t]||{}),color:'#111111'}});return d}}function saveData(d){localStorage.setItem(KEY,JSON.stringify(d))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){let x=Number(n)||0;return (x>0?'+':'')+x.toFixed(1)}function beeSvg(){return `<svg class="bee" viewBox="0 0 380 300" role="img" aria-label="鳥獣戯画風の写実的な蜂の墨絵"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe878"/><stop offset=".5" stop-color="#e0ae13"/><stop offset="1" stop-color="#7b5a08"/></linearGradient></defs><g stroke="#211f17" stroke-linecap="round" stroke-linejoin="round"><path d="M151 111 C108 40 42 47 67 104 C82 133 119 136 157 139Z" fill="#eee9d9" stroke-width="4"/><path d="M177 104 C192 34 270 42 257 91 C247 120 218 133 183 137Z" fill="#f7f1df" stroke-width="4"/><path d="M152 117 C175 88 219 103 236 139 C255 179 227 223 189 238 C160 222 128 189 135 151Z" fill="url(#gold)" stroke-width="5"/><path d="M145 134 Q173 147 220 131 L231 157 Q190 178 137 160Z" fill="#201f18" stroke-width="2"/><path d="M144 179 Q185 198 237 173 L224 199 Q190 219 158 204Z" fill="#201f18" stroke-width="2"/><path d="M155 118 Q141 91 159 76 Q177 65 195 85 Q206 102 192 121Z" fill="#24221a" stroke-width="4"/><path d="M164 82 Q146 54 125 66 M183 81 Q199 52 221 61" fill="none" stroke-width="4"/><circle cx="159" cy="95" r="5" fill="#f9df64" stroke-width="2"/><circle cx="183" cy="94" r="5" fill="#f9df64" stroke-width="2"/><path d="M164 108 Q174 116 185 107" fill="none" stroke-width="3"/><path d="M235 176 Q279 191 303 163 L286 199 Q261 214 225 205Z" fill="#28251b" stroke-width="4"/><path d="M300 164 L324 144 L315 176Z" fill="#f1cf36" stroke-width="3"/><path d="M157 203 L129 239 L153 231 L170 216 M201 217 L218 255 L226 230" fill="none" stroke-width="7"/><path d="M149 137 Q105 153 104 182 M212 145 Q251 151 258 171" fill="none" stroke-width="5"/><path d="M61 255 Q123 270 176 256 T315 255" fill="none" stroke="#9d7b13" stroke-width="2" stroke-dasharray="3 8"/></g><g fill="#fff7d2" opacity=".7"><path d="M82 86 Q108 72 130 108 Q101 115 82 86Z"/><path d="M207 80 Q236 59 246 83 Q229 102 207 80Z"/></g></svg>`}
function compute(d){let stats={};d.players.forEach(p=>stats[p.id]={player:p,points:0,best:null,matches:0});let team={};d.teams.forEach(t=>team[t]=0);for(const r of d.results){let sorted=[...r.entries].sort((a,b)=>Number(b.score)-Number(a.score));sorted.forEach((e,i)=>{if(!stats[e.playerId])return;let place=i+1,pt=(Number(e.score)-d.settings.return)/1000+d.settings.uma[place-1]+(place===1?d.settings.oka:0);stats[e.playerId].points+=pt;stats[e.playerId].matches++;stats[e.playerId].best=stats[e.playerId].best===null?Number(e.score):Math.max(stats[e.playerId].best,Number(e.score));team[stats[e.playerId].player.team]=(team[stats[e.playerId].player.team]||0)+pt})}Object.values(stats).forEach(s=>{s.points+=Number(d.manualPoints[s.player.id]||0);if(d.manualBest[s.player.id]!==undefined&&d.manualBest[s.player.id]!=='' )s.best=Math.max(s.best??-Infinity,Number(d.manualBest[s.player.id]));});Object.keys(team).forEach(t=>team[t]+=Number(d.manualTeamPoints[t]||0));return {players:Object.values(stats),team}}
function tableRows(rows,cols){return `<div class="table-scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}function rankingTable(items,type,all=false){let list=[...items].sort((a,b)=>type==='best'?((b.best??-Infinity)-(a.best??-Infinity)):b.points-a.points);if(type==='team')list=[...items].sort((a,b)=>b.points-a.points);let visible=all?list:list.slice(0,8);return tableRows(visible.map((x,i)=>{let name=type==='team'?x.name:x.player.name,team=type==='team'?x.name:x.player.team,score=type==='team'?x.points:type==='best'?(x.best??'—'):x.points;return `<tr><td>${i+1}</td><td>${esc(name)}</td><td>${esc(team)}</td><td class="num ${Number(score)<0?'neg':Number(score)>0?'pos':''}">${score==='—'?'—':type==='best'?esc(score):fmt(score)}</td></tr>`}).join(''),['順位','選手名','チーム',type==='best'?'最高得点':'スコア'].map((s,i)=>type==='team'&&i===1?'チーム名':s))}
function rankingsSection(d,full=false){let c=compute(d);let teams=d.teams.map(t=>({name:t,points:c.team[t]||0})).sort((a,b)=>b.points-a.points);return `<section id="ranking"><div class="section-title"><h2>ランキング</h2><small>RANKINGS</small></div><div class="panel"><h3>チームポイントランキング</h3>${tableRows(teams.map((t,i)=>`<tr><td>${i+1}</td><td colspan="2">${esc(t.name)}</td><td class="num ${t.points<0?'neg':'pos'}">${fmt(t.points)}</td></tr>`).join(''),['順位','チーム名','', 'ポイント'])}</div><div class="grid"><div class="panel"><h3>個人ポイントランキング</h3>${rankingTable(c.players,'points',full)}${!full&&c.players.length>8?'<button class="showall" data-expand="points">8位以下を表示　＋</button>':''}</div><div class="panel"><h3>最高スコアランキング</h3>${rankingTable(c.players,'best',full)}${!full&&c.players.length>8?'<button class="showall" data-expand="best">8位以下を表示　＋</button>':''}</div></div></section>`}
function home(){let d=getData();document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">JAPANESE MAHJONG LEAGUE</div><h1 class="brush-title">雀蜂杯</h1><div class="tagline">一打に、想いを込めろ。</div><p>勝負の一瞬に、すべてを懸ける。</p><a class="cta" href="players.html">出場選手一覧を見る →</a></div><div class="bee-wrap">${beeSvg()}</div></section><div class="wrap">${rankingsSection(d)}<section id="news"><div class="section-title"><h2>最新情報</h2><small>NEWS</small></div><div class="panel">${d.news.length?d.news.map(n=>`<div class="record"><small>${esc(n.date)}</small><div><b>${esc(n.title)}</b></div><div>${esc(n.body)}</div></div>`).join(''):'最新情報は準備中です。'}</div></section><section><div class="section-title"><h2>参戦チーム</h2><small>TEAMS</small></div><div class="team-grid">${d.teams.map(t=>`<div class="team">${esc(t)}<small>TEAM</small></div>`).join('')}</div></section></div>`;document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{location.href='ranking.html?view='+b.dataset.expand})}
function playersPage(){let d=getData();document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-title"><h2>出場選手一覧</h2><small>PLAYERS</small></div><p>雀蜂杯に出場する全選手のプロフィール。</p><div class="team-grid">${d.players.map(p=>`<article class="team"><div style="font-size:11px;color:#8b7200">${esc(p.team)}</div><h3>${esc(p.name)}</h3><small>${esc(p.profile||'プロフィール未登録')}</small></article>`).join('')}</div><p><a class="cta" href="index.html">← トップへ戻る</a></p></div>`}
function rankingPage(){let d=getData(),v=new URLSearchParams(location.search).get('view')||'points',c=compute(d),items=[...c.players].sort((a,b)=>v==='best'?((b.best??-Infinity)-(a.best??-Infinity)):b.points-a.points);document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-title"><h2>${v==='best'?'最高スコアランキング':'個人ポイントランキング'}</h2><small>FULL RANKING</small></div><div class="panel">${rankingTable(items,v,true)}</div><a class="cta" href="index.html#ranking">← ランキングへ戻る</a></div>`}
function adminPage(){let d=getData();let playerOpts=d.players.map(p=>`<option value="${p.id}">${esc(p.name)}（${esc(p.team)}）</option>`).join('');document.getElementById('app').innerHTML=`<div class="wrap"><div class="section-title" style="justify-content:space-between;gap:14px;flex-wrap:wrap"><div><h2>管理者画面</h2><small>ADMIN CONSOLE</small></div><button class="btn danger" id="adminlogout" type="button">ログアウトしてホームへ</button></div><div class="notice">クラウド保存モード：管理者ログイン後に保存した内容は共通データベースへ送信され、公開サイト全体に反映されます。</div><div class="subnav" style="margin:18px 0"><a href="#logosettings">ヘッダーアイコン</a><a href="#teamadmin">チーム設定</a><a href="#scheduleadmin">対戦スケジュール</a><a href="#tournamentadmin">大会スケジュール</a><a href="#aboutadmin">ABOUT編集</a><a href="#players">選手管理</a><a href="#settings">ルール設定</a><a href="#result">半荘結果入力</a><a href="#manual">手動調整</a><a href="#newsadmin">お知らせ</a><a href="#backup">データ管理</a></div><section id="logosettings" class="panel"><h3>ヘッダーの雀蜂杯アイコン</h3><p>ホーム画面のヘッダーとフッターに表示するアイコン画像を変更できます。透過PNGや正方形の画像がおすすめです。</p><div class="form-grid"><div class="field"><label>アイコン画像</label><input id="sitelogofile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div><div class="field"><label>現在のプレビュー</label><div id="sitelogopreview" style="width:76px;height:76px;background:#ffd900;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:900">蜂</div></div></div><div class="row-actions"><button class="btn yellow" id="savesitelogo">アイコン画像を保存</button><button class="btn" id="resetsitelogo">初期アイコンに戻す</button></div><p class="notice">画像は最大10,000kB（約10MB）。保存するとクラウド上の共有データに反映されます。</p></section><section id="teamadmin" class="panel"><h3>チーム設定</h3><p>チーム名・カラーコード・ロゴ画像を設定できます。保存内容は公開サイト全体に共有されます。</p><div id="teamsettings"></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>新しいチーム名</label><input id="newteamname" placeholder="チーム名"></div><div class="field"><label>チーム略称（任意・最大7文字）</label><input id="newteamshort" maxlength="7" placeholder="ランキング表示用"></div><div class="field"><label>チーム名カラー（カラーコード）</label><input id="newteamcolor" value="#F2CC24" placeholder="#F2CC24"></div></div><div class="row-actions"><button class="btn yellow" id="addteam">チームを追加</button></div><p class="notice">チームを削除すると、そのチーム所属の選手の所属先も自動で先頭のチームに変更されます。</p></section><section id="scheduleadmin" class="panel"><h3>対戦スケジュール管理</h3><p>対戦カードを登録すると、ホーム画面に新しい順で最大10戦をリーグ戦風に表示します。日付・節・出場チーム・開始時刻・ステータス・結果を入力できます。</p><div class="form-grid"><div class="field"><label>対戦日</label><input id="fixturedate" type="date"></div><div class="field"><label>節・対局名</label><input id="fixturename" placeholder="第1節・第1試合"></div><div class="field"><label>開始時刻</label><input id="fixturetime" type="time"></div><div class="field"><label>ステータス</label><select id="fixturestatus"><option value="予定">対戦予定</option><option value="LIVE">LIVE</option><option value="終了">対局終了</option></select></div>${[0,1,2,3].map(i=>`<div class="field"><label>出場チーム ${i+1}</label><select id="fixtureteam${i}">${d.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>`).join('')}<div class="field" style="grid-column:1/-1"><label>結果・補足（任意）</label><input id="fixtureresult" placeholder="例：雀蜂 +52.1pt ／ 対局終了後に入力"></div></div><div class="row-actions"><button class="btn yellow" id="addfixture">対戦スケジュールを登録</button></div><h4>登録済み対戦カード</h4><div id="fixturelist"></div></section><section id="tournamentadmin" class="panel"><h3>大会スケジュール管理</h3><p>対戦スケジュールとは別に、予選・準決勝・決勝など大会全体の日程を登録できます。</p><div class="form-grid"><div class="field"><label>区分</label><input id="tphase" placeholder="例：予選"></div><div class="field"><label>日程・タイトル</label><input id="ttitle" placeholder="例：予選リーグ"></div><div class="field"><label>開催日</label><input id="tdate" type="date"></div><div class="field"><label>補足</label><input id="tnote" placeholder="例：オンライン開催"></div></div><div class="row-actions"><button class="btn yellow" id="addtournament">大会スケジュールを追加</button></div><h4>登録済み大会スケジュール</h4><div id="tournamentlist"></div></section><section id="aboutadmin" class="panel"><h3>ABOUT（雀蜂杯とは）編集</h3><p>「雀蜂杯とは」の見出し下に表示するキャッチコピー・説明文と、主催者情報を編集できます。</p><div class="form-grid"><div class="field" style="grid-column:1/-1"><label>雀蜂杯とは：キャッチコピー</label><input id="abouttagline" maxlength="160" placeholder="例：一打に、想いを込めろ。"></div><div class="field" style="grid-column:1/-1"><label>雀蜂杯とは：説明文</label><textarea id="aboutdescription" rows="4" maxlength="1200" placeholder="大会の目的や特徴を説明"></textarea></div><div class="field"><label>主催者名</label><input id="aboutname" placeholder="主催者名"></div><div class="field"><label>主催者の立ち絵・画像</label><input id="aboutimage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div><div class="field" style="grid-column:1/-1"><label>あいさつ文</label><textarea id="aboutgreeting" rows="6" placeholder="大会への思いや視聴者へのメッセージ"></textarea></div><div class="field"><label>TikTok URL</label><input id="abouttiktok" type="url" placeholder="https://www.tiktok.com/@username"></div><div class="field"><label>X URL</label><input id="aboutx" type="url" placeholder="https://x.com/username"></div><div class="field"><label>YouTube URL</label><input id="aboutyoutube" type="url" placeholder="https://www.youtube.com/@channel"></div><div class="field"><label>Instagram URL</label><input id="aboutinstagram" type="url" placeholder="https://www.instagram.com/username/"></div></div><div id="aboutimagepreview" style="margin-top:12px"></div><div class="row-actions"><button class="btn yellow" id="saveabout">ABOUTを保存</button></div></section><section id="players" class="panel"><h3>選手管理</h3><div class="form-grid"><div class="field"><label>選手名</label><input id="pname" placeholder="選手名"></div><div class="field"><label>所属チーム</label><select id="pteam">${d.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>所属事務所</label><input id="pagency" placeholder="事務所名"></div><div class="field"><label>デビュー日</label><input id="pdebut" type="date"></div><div class="field" style="grid-column:1/-1"><label>立ち絵画像（画像ファイルを直接登録）</label><div id="portrait-upload-zone" class="portrait-upload-zone" tabindex="0"><strong>画像ファイルを選択</strong><span>または画像をここへドラッグ＆ドロップ／コピーした画像を Ctrl+V で貼り付け</span><input id="pimage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><div id="pimage-preview" class="pimage-preview">画像はまだ選択されていません</div></div><small>URL入力は不要です。透過PNG推奨。登録後にマウスで大きさ・位置を調整できます。</small></div><div class="field"><label>好きな役</label><input id="pfavoriterole" placeholder="例：国士無双"></div><div class="field" style="grid-column:1/-1"><label>意気込み</label><textarea id="penthusiasm" rows="2" placeholder="大会への意気込み"></textarea></div><div class="field" style="grid-column:1/-1"><label>リスナー様へ一言</label><textarea id="plistener" rows="2" placeholder="応援してくれるリスナー様へ"></textarea></div><div class="field" style="grid-column:1/-1"><label>プロフィール・紹介文（任意）</label><textarea id="pprofile" rows="3" placeholder="経歴・自己紹介など"></textarea></div><div class="field"><label>TikTok URL（任意）</label><input id="ptiktok" type="url" placeholder="https://www.tiktok.com/@username"></div><div class="field"><label>X URL（任意）</label><input id="pxurl" type="url" placeholder="https://x.com/username"></div></div><div class="row-actions"><button class="btn yellow" id="addplayer">選手を追加</button></div><div id="playerlist">${d.players.map(p=>`<div class="record"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${p.image?`<img class="player-admin-thumb" src="${p.image}" alt="">`:''}<b>${esc(p.name)}</b> — ${esc(p.team)}</div><small>事務所：${esc(p.agency||'所属事務所未登録')} ／ デビュー月：${esc(p.debutMonth||'未登録')}</small><br><small>${esc(p.tiktok||'TikTok未登録')} ／ ${esc(p.x||'X未登録')}</small><div class="row-actions"><label class="btn" style="cursor:pointer">画像を選ぶ<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-playerimage="${p.id}" hidden></label>${p.image?`<button class="btn" data-layoutplayer="${p.id}">画像サイズ・位置を調整</button>`:''}<button class="btn" data-editplayer="${p.id}">情報を編集</button><button class="btn danger" data-delplayer="${p.id}">削除</button></div></div>`).join('')}</div><hr style="margin:24px 0;border:0;border-top:1px solid var(--line)"><h4>所属事務所の管理</h4><p>事務所名と事務所アイコン画像を登録できます。選手一覧の事務所見出しに表示されます。</p><div class="form-grid"><div class="field"><label>事務所名</label><input id="agencyname" placeholder="事務所名"></div><div class="field"><label>事務所アイコン画像</label><input id="agencyimage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div></div><div class="row-actions"><button class="btn yellow" id="addagency">事務所を追加・更新</button></div><div id="agencylist"></div></section><section id="sitetext" class="panel"><h3>ホーム画面の文章編集</h3><p>トップページのキャッチコピーや、その下の紹介文を自由に変更できます。</p><div class="form-grid"><div class="field" style="grid-column:1/-1"><label>メインキャッチコピー</label><input id="homeheadline" maxlength="120" placeholder="例：最高の卓を、最高の仲間と。"></div><div class="field" style="grid-column:1/-1"><label>キャッチコピーの下の文章</label><textarea id="homesubtitle" rows="3" maxlength="500" placeholder="ホーム画面に表示する紹介文"></textarea></div><div class="field" style="grid-column:1/-1"><label>英語の大会名</label><input id="homeenglish" maxlength="80" placeholder="JAMPO CUP"></div></div><div class="row-actions"><button class="btn yellow" id="savesitetext">ホーム画面の文章を保存</button></div><p class="notice">保存後、共有データベースに保存され、公開サイト全体に反映されます。反映に最大30秒ほどかかる場合があります。</p></section><section id="settings" class="panel"><h3>半荘ポイント計算ルール</h3><p>初期持ち点・返し点・ウマ・オカを設定できます。初期設定は Mリーグ形式を想定した値です。</p><div class="form-grid"><div class="field"><label>開始点</label><input id="start" type="number" value="${d.settings.start}"></div><div class="field"><label>返し点</label><input id="return" type="number" value="${d.settings.return}"></div><div class="field"><label>1位ウマ</label><input id="uma1" type="number" value="${d.settings.uma[0]}"></div><div class="field"><label>2位ウマ</label><input id="uma2" type="number" value="${d.settings.uma[1]}"></div><div class="field"><label>3位ウマ</label><input id="uma3" type="number" value="${d.settings.uma[2]}"></div><div class="field"><label>4位ウマ</label><input id="uma4" type="number" value="${d.settings.uma[3]}"></div><div class="field"><label>オカ（1位加算）</label><input id="oka" type="number" value="${d.settings.oka}"></div></div><div class="row-actions"><button class="btn yellow" id="savesettings">ルールを保存</button></div><p class="notice">計算式： (最終持ち点 − 返し点) ÷ 1,000 ＋ 順位ウマ ＋ 1位オカ。点数は千点単位で計算します。返し点はルールの記録用で、計算は返し点を基準にしています。</p></section><section id="result" class="panel"><h3>半荘結果入力</h3><p>1半荘につき4人の選手と最終持ち点を入力。保存すると個人ポイント・チームポイント・最高得点が自動更新されます。</p><div class="field"><label>対局名・半荘番号</label><input id="rname" placeholder="第1節 第1回戦"></div><div class="form-grid" id="entries">${[0,1,2,3].map(i=>`<div class="panel"><b>${i+1}人目</b><div class="field"><label>選手</label><select id="rp${i}">${playerOpts}</select></div><div class="field"><label>最終持ち点</label><input id="rs${i}" type="number" value="${i===0?45000:i===1?30000:i===2?15000:10000}"></div></div>`).join('')}</div><div class="row-actions"><button class="btn yellow" id="saveresult">半荘結果を登録</button></div><div id="resultmsg"></div><h4>登録済み半荘結果（修正・削除）</h4><div id="resultlist"></div></section><section id="manual" class="panel"><h3>ポイント・最高得点の手動調整</h3><div class="form-grid"><div class="field"><label>選手</label><select id="mpplayer">${playerOpts}</select></div><div class="field"><label>個人ポイントへの加算・減算</label><input id="mpvalue" type="number" step="0.1" value="0"></div><div class="field"><label>最高得点の手動登録</label><input id="bestvalue" type="number" placeholder="例：72000"></div><div class="field"><label>チームポイントの調整先</label><select id="mtteam">${d.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>チームポイント調整値（累計に加算）</label><input id="mtvalue" type="number" step="0.1" value="0"><small id="teamcurrent"></small></div></div><div class="row-actions"><button class="btn yellow" id="savemanual">手動調整を保存</button></div></section><section id="newsadmin" class="panel"><h3>最新情報の追加</h3><div class="form-grid"><div class="field"><label>日付</label><input id="ndate" type="date"></div><div class="field"><label>タイトル</label><input id="ntitle" placeholder="お知らせタイトル"></div><div class="field" style="grid-column:1/-1"><label>本文</label><textarea id="nbody" rows="3"></textarea></div></div><div class="row-actions"><button class="btn yellow" id="addnews">お知らせを追加</button></div><h4>登録済み最新情報（編集・削除）</h4><div id="newsadminlist"></div></section><section id="backup" class="panel"><h3>データ管理</h3><div class="row-actions"><button class="btn" id="exportdata">JSONを書き出す</button><label class="btn" for="importfile">JSONを読み込む</label><input id="importfile" type="file" accept="application/json" hidden><button class="btn danger" id="resetdata">初期データに戻す</button></div><textarea id="jsonout" rows="5" style="width:100%;margin-top:12px;display:none"></textarea></section></div>`;wireAdmin()}
function wireAdmin(){let d=getData(),$=id=>document.getElementById(id),refresh=()=>{saveData(d);adminPage()};const logoPreview=$('sitelogopreview');if(logoPreview)logoPreview.innerHTML=d.siteLogo?`<img src="${d.siteLogo}" alt="現在のアイコン" style="width:100%;height:100%;object-fit:cover">`:'蜂';let pendingSiteLogo=null;
function compressSiteLogo(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('画像ファイルを読み込めませんでした'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('画像を開けませんでした'));img.onload=()=>{const max=512,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);try{resolve(canvas.toDataURL('image/webp',0.82));}catch(e){reject(e)}};img.src=reader.result};reader.readAsDataURL(file)})}
$('sitelogofile').onchange=async()=>{const f=$('sitelogofile').files?.[0];if(!f)return;if(f.size>12000000){alert('画像は12MB以下のファイルを選択してください');$('sitelogofile').value='';return}try{pendingSiteLogo=await compressSiteLogo(f);logoPreview.innerHTML=`<img src="${pendingSiteLogo}" alt="アイコンプレビュー" style="width:100%;height:100%;object-fit:contain">`;}catch(e){alert('画像を読み込めませんでした。PNG・JPG・WebP画像をお試しください。');$('sitelogofile').value='';}};
$('savesitelogo').onclick=()=>{if(!pendingSiteLogo&&!d.siteLogo)return alert('先にアイコン画像を選択してください');if(pendingSiteLogo)d.siteLogo=pendingSiteLogo;try{saveData(d);pendingSiteLogo=null;alert('ヘッダーアイコンを保存しました。ホーム画面を再読み込みすると反映されます。');}catch(e){alert('保存できませんでした。ブラウザの保存容量が不足している可能性があります。選手画像などを含むデータをJSONに書き出してバックアップしたうえで、画像を小さくしてお試しください。')}};
$('resetsitelogo').onclick=()=>{if(!confirm('ヘッダーアイコンを初期状態に戻しますか？'))return;delete d.siteLogo;pendingSiteLogo=null;try{saveData(d);adminPage();}catch(e){alert('保存できませんでした。')}};
$('adminlogout').onclick=async()=>{try{if(window.JAMPO_CLOUD_CONFIGURED&&window.JAMPO_CLOUD)await window.JAMPO_CLOUD.logout();}catch(e){console.warn(e)}location.href='index.html';};d.teamMeta=d.teamMeta||{};d.fixtures=d.fixtures||[];d.agencyMeta=d.agencyMeta||{};function renderAgencySettings(){let host=$('agencylist');if(!host)return;let names=[...new Set(['所属事務所未登録',...(d.players||[]).map(p=>(p.agency||'').trim()).filter(Boolean),...Object.keys(d.agencyMeta)])].sort((a,b)=>a.localeCompare(b,'ja'));

$('savesettings').onclick=()=>{d.settings={start:+$('start').value,return:+$('return').value,uma:[+$('uma1').value,+$('uma2').value,+$('uma3').value,+$('uma4').value],oka:+$('oka').value};refresh()};$('saveresult').onclick=()=>{let entries=[0,1,2,3].map(i=>({playerId:$('rp'+i).value,score:+$('rs'+i).value}));if(new Set(entries.map(e=>e.playerId)).size!==4)return alert('4人別々の選手を選択してください');if(entries.some(e=>!Number.isFinite(e.score)))return alert('持ち点を入力してください');d.results.push({id:Date.now(),name:$('rname').value||`半荘${d.results.length+1}`,date:new Date().toISOString().slice(0,10),entries});saveData(d);$('resultmsg').innerHTML='<p class="pos">登録しました。ランキングに自動反映されました。</p>';};const showTeamCurrent=()=>{let t=$('mtteam').value;let c=compute(d);$('teamcurrent').textContent=`現在のチーム累計：${fmt(c.team[t]||0)} pt ／ 登録済み調整値：${fmt(d.manualTeamPoints[t]||0)} pt（入力欄を変更して保存すると調整値を置き換え）`;};$('mtteam').onchange=showTeamCurrent;showTeamCurrent();$('savemanual').onclick=()=>{let id=$('mpplayer').value;d.manualPoints[id]=+$('mpvalue').value;if($('bestvalue').value!=='')d.manualBest[id]=+$('bestvalue').value;let t=$('mtteam').value;d.manualTeamPoints[t]= +$('mtvalue').value;saveData(d);alert('手動調整を保存しました')};function renderResultList(){let host=$('resultlist');if(!host)return;host.innerHTML=d.results.length?d.results.map((r,idx)=>`<div class="record"><b>${esc(r.name||`半荘${idx+1}`)}</b> <small>${esc(r.date||'')}</small><div>${r.entries.map(e=>{let p=d.players.find(x=>x.id===e.playerId);return `${esc(p?.name||'削除済み選手')}：${Number(e.score).toLocaleString()}点`}).join(' ／ ')}</div><div class="row-actions"><button class="btn" data-editresult="${r.id}">この結果を修正</button><button class="btn danger" data-delresult="${r.id}">この結果を削除</button></div></div>`).join(''):'<p>登録済みの半荘結果はありません。</p>';host.querySelectorAll('[data-delresult]').forEach(b=>b.onclick=()=>{if(confirm('この半荘結果を削除しますか？ランキング・チームポイントも再計算されます。')){d.results=d.results.filter(r=>String(r.id)!==b.dataset.delresult);saveData(d);adminPage()}});host.querySelectorAll('[data-editresult]').forEach(b=>b.onclick=()=>{let r=d.results.find(x=>String(x.id)===b.dataset.editresult);if(!r)return;let newName=prompt('対局名',r.name||'');if(newName===null)return;for(let i=0;i<r.entries.length;i++){let p=d.players.find(x=>x.id===r.entries[i].playerId);let sc=prompt(`${p?.name||'選手'} の最終持ち点`,String(r.entries[i].score));if(sc===null)return;if(sc.trim()===''||!Number.isFinite(Number(sc)))return alert('点数が正しくありません。変更は保存されていません。');r.entries[i].score=Number(sc)}r.name=newName;saveData(d);adminPage();alert('半荘結果を修正しました。ランキングとチームポイントを再計算しました。')})};renderResultList();function renderNewsAdmin(){const host=$('newsadminlist');if(!host)return;host.innerHTML=d.news.length?d.news.map((n,i)=>`<div class="record"><small>${esc(n.date||'日付未設定')}</small><div><b>${esc(n.title||'無題')}</b></div><div style="white-space:pre-wrap">${esc(n.body||'')}</div><div class="row-actions"><button class="btn" data-editnews="${n.id??i}">編集</button><button class="btn danger" data-delnews="${n.id??i}">削除</button></div></div>`).join(''):'<p>最新情報はまだ登録されていません。</p>';host.querySelectorAll('[data-editnews]').forEach(b=>b.onclick=()=>{const key=b.dataset.editnews;const idx=d.news.findIndex((x,i)=>String(x.id??i)===key);if(idx<0)return;const n=d.news[idx];const date=prompt('日付（YYYY-MM-DD）',n.date||'');if(date===null)return;const title=prompt('タイトル',n.title||'');if(title===null)return;if(!title.trim())return alert('タイトルを入力してください');const body=prompt('本文',n.body||'');if(body===null)return;d.news[idx]={...n,date:date.trim(),title:title.trim(),body};saveData(d);renderNewsAdmin();alert('最新情報を更新しました。ホームを再読み込みすると反映されます。')});host.querySelectorAll('[data-delnews]').forEach(b=>b.onclick=()=>{const key=b.dataset.delnews;if(!confirm('この最新情報を削除しますか？'))return;d.news=d.news.filter((x,i)=>String(x.id??i)!==key);saveData(d);renderNewsAdmin()})};renderNewsAdmin();$('addnews').onclick=()=>{let title=$('ntitle').value.trim();if(!title)return alert('タイトルを入力してください');d.news.unshift({id:Date.now(),date:$('ndate').value||new Date().toISOString().slice(0,10),title,body:$('nbody').value});saveData(d);$('ndate').value='';$('ntitle').value='';$('nbody').value='';renderNewsAdmin();alert('お知らせを追加しました')};$('exportdata').onclick=()=>{$('jsonout').style.display='block';$('jsonout').value=JSON.stringify(d,null,2)};$('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{d=JSON.parse(await f.text());saveData(d);alert('読み込みました');adminPage()}catch(err){alert('JSONを読み込めませんでした')}};$('resetdata').onclick=()=>{if(confirm('保存済みの選手・結果・調整をすべて消して初期状態に戻しますか？')){localStorage.removeItem(KEY);adminPage()}}}
